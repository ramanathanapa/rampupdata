{{ define "main" }}
<h1>{{ .Title }}</h1>
<section class="post-list">
  {{ range .Pages }}
  <article class="post-summary">
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <time>{{ .Date.Format "Jan 2, 2006" }}</time>
    <p>{{ .Summary }}</p>
  </article>
  {{ end }}
</section>
{{ end }}
