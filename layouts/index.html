{{ define "main" }}
<div class="docs-layout">
  <aside class="docs-sidebar">
    <div class="sidebar-panel">
      <h2>Discover posts</h2>
      <ul class="sidebar-links">
        {{ range (sort (where .Site.RegularPages "Type" "posts") "Title") }}
        <li class="sidebar-item{{ if eq .Permalink $.Permalink }} active{{ end }}">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
        {{ end }}
      </ul>
    </div>
  </aside>

  <section class="docs-content home-post">
    {{ $post := first 1 (sort (where .Site.RegularPages "Type" "posts") "Title") }}
    {{ range $post }}
      <article class="doc-page">
        <div class="doc-content">
          {{ .Content }}
        </div>
      </article>
    {{ end }}
  </section>
</div>
{{ end }}
